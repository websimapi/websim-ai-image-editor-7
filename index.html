<html>
<head>
  <title>AI Image Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>AI Image Editor</h1>
    
    <div class="editor-section">
      <div class="input-group">
        <select id="prefixPrompt">
          <option value="">Select Prefix...</option>
          <option value="HD ">HD</option>
          <option value="4K ">4K</option>
          <option value="Cartoon style ">Cartoon</option>
          <option value="Realistic ">Realistic</option>
          <option value="Photorealistic ">Photorealistic</option>
          <option value="Black and white ">Black & White</option>
          <option value="Vintage ">Vintage</option>
          <option value="Anime style ">Anime</option>
        </select>
        <input type="text" id="promptInput" placeholder="Enter your image prompt here...">
        <select id="suffixPrompt">
          <option value="">Select Suffix...</option>
          <option value=", white background">White Background</option>
          <option value=", black background">Black Background</option>
          <option value=", green background">Green Background</option>
          <option value=", blue background">Blue Background</option>
          <option value=", high quality">High Quality</option>
          <option value=", detailed">Detailed</option>
          <option value=", 8K">8K</option>
          <option value=", professional lighting">Professional Lighting</option>
        </select>
        <button onclick="Editor.generateImage()">Generate</button>
        <input type="file" id="imageUpload" accept="image/*" onchange="Editor.handleImageUpload(event)" style="display:none">
        <button onclick="document.getElementById('imageUpload').click()">Load Image</button>
      </div>

      <div class="image-container" id="imageContainer">
        <div id="loadingSpinner" class="loading" style="display: none;"></div>
        <div id="placeholderText" class="placeholder-text">Enter a prompt to generate an image or load one from your device</div>
        <div class="canvas-container">
          <canvas id="editCanvas"></canvas>
          <div class="zoom-controls">
            <button class="zoom-button" id="zoomOut" title="Zoom Out">−</button>
            <div class="zoom-level" id="zoomLevel">100%</div>
            <button class="zoom-button" id="zoomIn" title="Zoom In">+</button>
            <button class="zoom-button" id="zoomReset" title="Reset View">↺</button>
          </div>
        </div>
        <div class="editor-controls" id="editorControls">
          <div class="tool-group">
            <button class="tool-button" onclick="Selection.setTool('magicWand')" id="magicWandTool" data-tooltip="Magic Wand">
              ✨
            </button>
            
            <div class="sensitivity-control" id="sensitivityControl" style="display: none;">
              <label for="sensitivitySlider">Sensitivity:</label>
              <input 
                type="range" 
                id="sensitivitySlider" 
                min="1" 
                max="100" 
                value="32"
                class="sensitivity-slider"
                title="Adjust magic wand sensitivity"
              >
              <span id="sensitivityValue">32</span>
            </div>
            
            <button class="tool-button" onclick="Selection.fillSelection()" id="fillSelectionTool" data-tooltip="Fill Selection">
              🎨
            </button>

            <button class="tool-button" onclick="Selection.setAlpha()" id="setAlphaTool" data-tooltip="Set Alpha">
              ⬜
            </button>

            <button class="tool-button" onclick="Selection.setTool('fillWithImage')" id="fillWithImageTool" data-tooltip="Fill with Generated Image">
              🖼️
            </button>

            <button class="tool-button" onclick="Selection.clearSelection()" id="clearSelectionTool" data-tooltip="Clear Selection">
              ❌
            </button>

            <div class="color-display">
              <div class="color-preview" id="colorPreview"></div>
              <input type="color" id="colorPicker" class="color-picker" value="#ffffff">
              <span class="color-value" id="colorValue">#FFFFFF</span>
            </div>
          </div>
          
          <div class="fill-image-prompt" id="fillImagePrompt" style="display: none;">
            <input type="text" id="selectionPromptInput" placeholder="Enter prompt for selected region...">
            <button onclick="Selection.fillWithImage(document.getElementById('selectionPromptInput').value.trim())">Prompt Fill Image</button>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button onclick="Editor.saveImage()" class="save-button" id="saveButton">Save Image</button>
        <button onclick="Editor.addToGallery()" class="add-gallery-button" id="addGalleryButton">Add to Gallery</button>
      </div>
    </div>

    <div class="gallery-container">
      <div class="gallery-header">
        <div class="gallery-tabs">
          <button class="gallery-tab active" onclick="Gallery.showTab('recent')">Recent</button>
          <button class="gallery-tab" onclick="Gallery.showTab('popular')">Popular</button>
          <button class="gallery-tab" onclick="Gallery.showTab('my')">My Images</button>
        </div>
        <div id="userFilterInfo" style="display: none;" role="status" aria-live="polite">
          <span>Showing images by: <strong id="userFilterName" aria-label="Current filter username"></strong></span>
          <button onclick="Gallery.clearUserFilter()" class="clear-filter-button" aria-label="Clear user filter">
            Clear Filter
          </button>
        </div>
        <div class="search-container">
          <input type="text" id="gallerySearch" placeholder="Search images by title or username..." onkeyup="Gallery.filterGallery()">
          <span class="search-icon">🔍</span>
        </div>
      </div>
      <div id="gallery" class="gallery"></div>
      <div class="gallery-pagination" id="galleryPagination">
        <button onclick="Gallery.changePage(-1)" class="pagination-button" id="prevPage">Previous</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button onclick="Gallery.changePage(1)" class="pagination-button" id="nextPage">Next</button>
      </div>
    </div>

    <div id="editTitleDialog" style="display: none;">
      <div class="dialog-content">
        <h3>Edit Image Title</h3>
        <input type="text" id="editTitleInput" placeholder="Enter new title">
        <div class="dialog-buttons">
          <button onclick="Gallery.cancelTitleEdit()">Cancel</button>
          <button onclick="Gallery.saveTitleEdit()">Save</button>
        </div>
      </div>
    </div>

    <script type="module">
      // Initialize room and setup on page load
      import { room, initRoom } from './js/room.js';
      import { Editor } from './js/editor.js';
      import { Gallery } from './js/gallery.js';
      import { Selection } from './js/selection.js';

      window.addEventListener('load', async () => {
        await initRoom();
        Editor.setup();
        await Gallery.init();

        // Set up global event handlers
        document.addEventListener('keydown', (e) => {
          if (e.shiftKey) Selection.isShiftPressed = true;
          if (e.ctrlKey) Selection.isCtrlPressed = true;
        });

        document.addEventListener('keyup', (e) => {
          if (!e.shiftKey) Selection.isShiftPressed = false;
          if (!e.ctrlKey) Selection.isCtrlPressed = false;
        });

        // Hook up global functions to window for HTML onclick handlers
        window.Editor = Editor;
        window.Gallery = Gallery;
        window.Selection = Selection; 
      });
    </script>

</body>
</html>
